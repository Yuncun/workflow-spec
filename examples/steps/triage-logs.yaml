# A container step whose program asks a model. Calling a model counts as reading outside data,
# and the step is not deterministic: the same inputs can give other outputs. Its outputs are
# still typed, so later steps can be checked.
name: acme/triage-logs
version: 0.4.1
title: Triage CI logs
description: Read CI logs, find the first real failure, and write a short report about it.
inputSchema:
  type: object
  properties:
    logs:
      $ref: urn:wfspec:file
      x-mediaType: text/plain
    style:
      type: string
      enum: [short, long]
      default: short
  required: [logs]
outputSchema:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 120
    report:
      type: string
    category:
      type: string
      enum: [test, build, infrastructure, flaky]
  required: [title, report, category]
effects: reads
deterministic: false
runtime:
  container:
    image: ghcr.io/acme/triage-logs:0.4.1
    command: [triage-logs]
