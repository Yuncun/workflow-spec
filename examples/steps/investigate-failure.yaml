# An agent step that calls other steps: it decides for itself which of the steps in `calls`
# to call. One of them opens issues, so its effects are 'writes', and it names that step's
# secret. examples/runs/investigate.run.json records one run of it, and
# examples/workflows/ci-triage.yaml is that run saved as a workflow.
name: acme/investigate-failure
version: 0.1.0
title: Investigate a CI failure
description: Look into a failed CI run using the steps it can call, and file an issue if the failure is real.
inputSchema:
  type: object
  properties:
    repo:
      type: string
      description: Repository as owner/name.
      pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    run_id:
      type: integer
      minimum: 1
  required: [repo, run_id]
outputSchema:
  type: object
  properties:
    summary:
      type: string
    issue:
      type: string
      format: uri
  required: [summary]
effects: writes
secrets: [GITHUB_TOKEN]
calls: [acme/fetch-ci-logs@2.1.0, acme/open-issue@1.0.3]
runtime:
  agent:
    model: example-large
    instructions: prompts/investigate.md
    maxTurns: 40
