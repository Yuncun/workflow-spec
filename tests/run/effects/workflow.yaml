# A runner doesn't let a step act beyond its effects (SPEC.md, [run.effects]): a `none` step reaches
# no network and reads no outside data, and a step that doesn't write writes nothing outside.
steps:
  network: { uses: test/try-network@1.0.0, with: { port: "{port}" } }
  write: { uses: test/try-write@1.0.0, with: { path: "{tmp}/should-not-exist.txt" } }
  read: { uses: test/try-read@1.0.0, with: { path: "{tmp}/outside.txt" } }
outputs:
  connected: { from: steps.network.outputs.connected }
  written: { from: steps.write.outputs.written }
  read: { from: steps.read.outputs.read }
