# A step that uses a subgraph kept in the file runs it as one step, and gives its outputs (SPEC.md, section 7.5).
steps:
  shout: { uses: subgraphs.shout, with: { text: hi } }
outputs:
  loud: { from: steps.shout.outputs.loud }
subgraphs:
  shout:
    inputSchema: { type: object, properties: { text: { type: string } }, required: [text] }
    steps:
      said: { uses: test/echo@1.0.0, with: { text: { from: inputs.text } } }
      loud: { uses: test/upper@1.0.0, with: { text: { from: steps.said.outputs.text } } }
    outputs:
      loud: { from: steps.loud.outputs.text }
