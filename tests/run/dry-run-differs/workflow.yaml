# A dry run whose deterministic step gives other outputs than the original run did is reported
# (SPEC.md, [publish.saved-run]).
steps:
  said: { uses: test/echo@1.0.0, with: { text: hi } }
  saved: { uses: test/save-text@1.0.0, with: { folder: "{tmp}", name: note.txt, text: { from: steps.said.outputs.text } } }
outputs:
  path: { from: steps.saved.outputs.path }
