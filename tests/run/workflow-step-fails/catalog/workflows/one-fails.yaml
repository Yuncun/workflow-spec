inputSchema: { type: object, properties: { text: { type: string } }, required: [text] }
steps:
  loud: { uses: test/upper@1.0.0, with: { text: { from: inputs.text } } }
  broken: { uses: test/fail@1.0.0, with: { text: { from: inputs.text } } }
outputs:
  loud: { from: steps.loud.outputs.text }
  broken: { from: steps.broken.outputs.text }
