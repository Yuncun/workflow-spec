# When a step inside a workflow step skips, its outputs are missing but the workflow step doesn't skip, so a step that reads one gets its input's default (SPEC.md, [run.workflow-step]).
steps:
  pick: { uses: test/first-or-none@1.0.0, with: { items: [] } }
  hello: { uses: test/greet@1.0.0, with: { name: { from: steps.pick.outputs.item } } }
outputs:
  greeting: { from: steps.hello.outputs.greeting }
