# Which tests cover each requirement id in SPEC.md (section 2.2).
#
# An entry is either a list of tests or { untested: <why> }.
# A test is a case folder, written check/<case>, manifests/<case> or run/<case>, or a test
# function in reference/tests/, written <file>::<function>.
# reference/tests/test_coverage.py keeps this file and SPEC.md in step, and fails when a case
# folder covers no id.

conform.checker-tests: [test_conformance.py::test_check_case, test_conformance.py::test_manifest_case]
conform.runner-tests: [test_runner.py::test_run_case]

doc.formats: [check/json-duplicate-key, check/yaml-1-2-words, check/yaml-binary, check/yaml-local-tag]
doc.yaml-1.2: [check/yaml-1-2-words]
doc.duplicate-keys: [check/parse-duplicate-key, check/json-duplicate-key]
doc.text-keys: [check/parse-number-key, check/yaml-dates-stay-text]
doc.merge-key: [check/yaml-merge-key, check/yaml-quoted-merge-key]
doc.numbers: [check/yaml-nan, check/yaml-big-integer]
doc.parse-error: [check/parse-duplicate-key, check/json-duplicate-key, check/yaml-nan, manifests/unreadable]

manifest.schema: [manifests/missing-effects, manifests/runtime-kind-unknown, manifests/owner-with-underscore]
manifest.extensions: [manifests/extension-fields]
manifest.workflow-file: [manifests/workflow-path-missing, manifests/workflow-step-wrong-digest, manifests/workflow-step-fails-checking]
manifest.calls-known: [manifests/calls-unknown]
manifest.calls-effects: [manifests/calls-effects-below, check/left-out-step]
manifest.calls-secrets: [manifests/calls-missing-secret]
manifest.calls-one-per-major: [manifests/calls-one-per-major]
manifest.no-self: [manifests/calls-itself, manifests/workflow-runs-itself]
manifest.workflow-derived: [manifests/workflow-step-claims-less, manifests/workflow-step-fails-checking, manifests/workflow-step-required-order, manifests/as-step-required-empty, manifests/as-step-default-is-required, manifests/as-step-may-skip-source]
manifest.json-schema: [manifests/not-a-json-schema, manifests/bad-pattern, check/workflow-input-schema-invalid]
manifest.required-declared: [manifests/required-not-declared]
manifest.default-fits: [manifests/bad-default, manifests/broken-schema-not-used]
manifest.examples-fit: [manifests/bad-example, manifests/broken-schema-not-used]
manifest.refs: [manifests/reference-not-allowed, manifests/data-is-not-a-reference]
manifest.invalid: [manifests/bad-default, manifests/calls-unknown, manifests/unreadable, manifests/broken-schema-not-used, manifests/every-problem-in-a-stage]
manifest.left-out: [check/left-out-step, manifests/left-out-workflow, manifests/left-out-in-order]
manifest.duplicate: [manifests/duplicate-step, manifests/duplicate-after-invalid, manifests/not-manifests]

types.json-schema: [manifests/bad-input-name]
types.fits: [check/shape-errors, check/shape-warnings, check/shape-edges, check/shape-more, check/shape-fits, check/file-into-object, check/keyword-names, check/maybe-missing-once]
types.format: [check/format-is-annotation]
types.file-value: [check/literal-files]
types.media-type: [check/literal-files, run/media-type]
types.file-store: [run/file-flow]
types.fits-error: [check/shape-errors, check/shape-edges, check/shape-more, check/files, check/file-into-object, check/type-mismatch-scalars, check/type-mismatch-object, check/type-mismatch-enum, check/constant-fits, check/ok-integer-into-number, check/shape-fits, check/keyword-names, check/maybe-missing-once]
types.fits-warning: [check/shape-warnings, check/shape-edges, check/shape-more, check/warnings-only]
types.maybe-missing: [check/type-mismatch-optional-input, check/type-mismatch-optional-output, check/maybe-missing-once, check/never-has-a-value]

workflow.schema: [check/invalid-missing-steps, check/invalid-uses-without-version, check/invalid-unknown-field]
workflow.input-schema: [check/workflow-input-reference, check/workflow-input-schema-invalid]
workflow.input-default: [check/invalid-input-default]
workflow.extensions: [check/extension-fields]
workflow.reference-form: [check/from-null, check/bad-reference, check/outputs-resolve, check/references-under-unknowns]
workflow.literal-form: [check/literal-wrapper]

check.all-at-once: [check/unknown-and-missing-input, check/policy, check/outputs-resolve, check/workflow-input-reference, check/workflow-input-schema-invalid]
check.invalid-workflow: [check/invalid-missing-steps, check/invalid-uses-without-version, check/workflow-input-reference, check/invalid-unknown-field, check/workflow-input-schema-invalid]
check.invalid-value: [check/invalid-values, check/invalid-input-default, check/literal-files, check/default-media-type]
check.unknown-step: [check/unknown-step-version, check/left-out-step, check/references-under-unknowns]
check.unknown-input: [check/unknown-and-missing-input, check/references-under-unknowns]
check.missing-input: [check/unknown-and-missing-input]
check.bad-reference: [check/bad-reference, check/from-null]
check.unknown-reference: [check/unknown-references]
check.type-mismatch: [check/type-mismatch-scalars, check/type-mismatch-object, check/type-mismatch-enum, check/type-mismatch-optional-input, check/type-mismatch-optional-output]
check.type-unchecked: [check/warnings-only, check/shape-warnings]
check.outputs-resolve: [check/outputs-resolve]
check.cycle: [check/cycle]
check.no-outputs: [check/no-outputs]
check.effects-not-allowed: [check/policy]
check.secret-not-granted: [check/policy]
check.step-never-runs: [check/warnings-only, check/bad-reference, check/outputs-resolve, check/needed-by-a-writer, check/references-under-unknowns, check/policy]
check.unused-input: [check/warnings-only, check/unknown-references, check/references-under-unknowns]
check.codes-stable: { untested: "a promise about later versions, which no test can check" }
check.platform-codes: { untested: "the reference checker reports no problems of its own" }
check.paths: [test_conformance.py::test_check_case, test_conformance.py::test_manifest_case]
check.output: [test_examples.py::test_cli_exit_codes]
check.policy: [check/policy, test_examples.py::test_a_platform_can_add_its_own_fields_and_error_codes]

run.check-first: [run/check-first, run/invalid-inputs, run/media-type]
run.lock: [run/lock, run/lock-matches]
run.needed: [run/needed]
run.order: [run/order-and-values, run/workflow-step]
run.missing-value: [run/missing-value]
run.input-check: [run/input-check]
run.output-check: [run/output-check, run/agent-finish-retry, run/typed-agent, run/output-escape]
run.pinned: [run/pinned, test_runner.py::test_a_workflow_file_changed_after_loading_fails_its_step]
run.cache-key: [test_examples.py::test_cache_key_matches_a_known_answer, test_examples.py::test_cache_key_ignores_file_names, run/cache, run/cache-miss]
run.cache-only-cacheable: [run/cache]
run.retry: [run/retry, run/dry-run]
run.failure: [run/failure]
run.skip: [run/skip]
run.error-codes: [run/failure, run/input-check, run/output-check, test_examples.py::test_a_platform_can_add_its_own_fields_and_error_codes]
run.secrets-named: [run/secrets, test_isolation.py::test_the_runner_keeps_secrets_out_of_its_environment]
run.secrets-hidden: [run/secrets, run/secret-in-skip, run/secret-in-file, run/short-secret, run/numeric-secret]
run.effects: [run/effects]
run.calls-listed: [run/calls]
run.calls-recorded: [run/calls, run/nested-calls]
run.record: [test_runner.py::test_run_case, run/bad-call-args]
run.extensions: [test_examples.py::test_a_platform_can_add_its_own_fields_and_error_codes]

publish.digest: [test_examples.py::test_digest_matches_a_known_answer, test_examples.py::test_lock_file_is_current]
publish.resolve: { untested: "the reference implementation hashes manifests as written, because it builds nothing" }
publish.immutable: { untested: "needs a publisher" }
publish.lock: [test_examples.py::test_lock_file_is_current, test_examples.py::test_lock_includes_the_steps_a_step_can_call, test_examples.py::test_lock_includes_the_steps_inside_a_published_workflow]
publish.as-step: [test_examples.py::test_workflow_published_as_step, test_examples.py::test_outputs_after_a_step_that_may_skip_are_optional, manifests/as-step-required-empty, manifests/as-step-default-is-required, manifests/as-step-may-skip-source]
publish.versions: { untested: "nothing checks it yet (proposals.md, P13)" }
publish.saved-run: [run/dry-run, run/dry-run-differs, run/dry-run-write-differs, run/dry-run-order, run/dry-run-dropped-write]
