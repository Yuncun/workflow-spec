inputSchema:
  type: object
  properties:
    topic: { type: string }
    unused: { type: integer }
  required: [topic]
steps:
  emit: { uses: test/emit-values@1.0.0 }
  extra: { uses: test/emit-values@1.0.0 }
  take:
    uses: test/take-values@1.0.0
    with:
      text: { from: inputs.topic }
      whole: { from: steps.emit.outputs.count }
      mode: { from: steps.emit.outputs.label }
outputs:
  done: { from: steps.take.outputs.done }
