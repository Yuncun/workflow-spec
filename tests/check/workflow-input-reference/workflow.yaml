# A workflow's own inputSchema follows the same rule as a manifest: only file references. One that
# breaks it isn't compared with the inputs it feeds (SPEC.md, [check.all-at-once]).
inputSchema:
  type: object
  $defs:
    word: { type: string }
  properties:
    topic: { $ref: "#/$defs/word" }
  required: [topic]
steps:
  take:
    uses: test/take-values@1.0.0
    with: { text: { from: inputs.topic } }
outputs:
  done: { from: steps.take.outputs.done }
