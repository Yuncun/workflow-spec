# A value that may be missing feeds a required input whose pattern also can't be proven. The input
# gets one problem, an error (SPEC.md, [types.maybe-missing], [types.fits]).
steps:
  emit: { uses: test/emit-values@1.0.0 }
  take: { uses: test/take-code@1.0.0, with: { code: { from: steps.emit.outputs.maybe } } }
outputs:
  done: { from: steps.take.outputs.done }
