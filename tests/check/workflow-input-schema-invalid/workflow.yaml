# An inputSchema that isn't valid JSON Schema, here with Python's names for types, is reported once,
# at /inputSchema, and its inputs aren't compared with the inputs they feed
# (SPEC.md, [check.paths], [check.all-at-once]).
inputSchema:
  type: object
  properties:
    count: { type: int, default: 3 }
    label: { type: str }
steps:
  take:
    uses: test/take-values@1.0.0
    with:
      text: { from: inputs.label }
      whole: { from: inputs.count }
outputs:
  done: { from: steps.take.outputs.done }
