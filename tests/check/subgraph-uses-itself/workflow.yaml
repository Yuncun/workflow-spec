# A subgraph uses itself (SPEC.md, [workflow.subgraph-use]).
steps:
  start: { uses: subgraphs.again, with: { text: hi } }
outputs:
  text: { from: steps.start.outputs.text }
subgraphs:
  again:
    inputSchema: { type: object, properties: { text: { type: string } }, required: [text] }
    steps:
      next: { uses: subgraphs.again, with: { text: { from: inputs.text } } }
    outputs:
      text: { from: steps.next.outputs.text }
