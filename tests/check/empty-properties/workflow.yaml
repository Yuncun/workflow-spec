# An empty properties or required counts as having none (Annex A.1), so a required name the source lacks is a warning, not an error.
steps:
  emit: { uses: test/emit-empty@1.0.0 }
  take:
    uses: test/take-shapes@1.0.0
    with:
      record: { from: steps.emit.outputs.no_properties }
      closed: { from: steps.emit.outputs.no_required }
outputs:
  done: { from: steps.take.outputs.done }
