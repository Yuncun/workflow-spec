name: test/emit-empty
version: 1.0.0
description: Produce objects whose properties and required are empty, for checker tests.
inputSchema: { type: object, properties: {} }
outputSchema:
  type: object
  properties:
    no_properties: { type: object, properties: {} }
    no_required: { type: object, required: [] }
  required: [no_properties, no_required]
effects: none
deterministic: true
runtime: { container: { image: example.test/emit-empty:1.0.0 } }
