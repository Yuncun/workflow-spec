# Each value has the right shape as far as the checker can tell, but a detail can't be proven.
steps:
  emit: { uses: test/emit-shapes@1.0.0 }
  take:
    uses: test/take-shapes@1.0.0
    with:
      strings: { from: steps.emit.outputs.bag }          # the source doesn't declare its item type
      textfile: { from: steps.emit.outputs.raw_file }    # the source doesn't say what kind of file
      either: { from: steps.emit.outputs.big }           # anyOf isn't compared
      text: { from: steps.emit.outputs.anything }        # the source declares no type
outputs:
  done: { from: steps.take.outputs.done }
