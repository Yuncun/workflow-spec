# A value whose schema is false may be missing, in fact always is. So it can't feed a required
# input, whatever that input accepts, and feeding an optional one is fine (SPEC.md, [types.maybe-missing]).
steps:
  a: { uses: test/never@1.0.0 }
  required-any:
    uses: test/take-anything@1.0.0
    with: { value: { from: steps.a.outputs.nothing } }
  required-text:
    uses: test/echo@1.0.0
    with: { text: { from: steps.a.outputs.nothing } }
  optional:
    uses: test/take-anything@1.0.0
    with: { value: fixed, extra: { from: steps.a.outputs.nothing } }
outputs:
  one: { from: steps.required-any.outputs.out }
  two: { from: steps.required-text.outputs.text }
  three: { from: steps.optional.outputs.out }
