name: test/secret-file
version: 1.0.0
description: Save the secret it's given into an output file.
inputSchema: { type: object, properties: {}, required: [] }
outputSchema: { type: object, properties: { file: { $ref: "urn:wfspec:file" } }, required: [file] }
effects: reads
secrets: [TOKEN_A]
runtime: { process: { command: [python3, programs/step.py, secret-file] } }
