name: test/show-secrets
version: 1.0.0
description: Say which secrets it was given.
inputSchema: { type: object, properties: {}, required: [] }
outputSchema: { type: object, properties: { a_set: { type: boolean }, b_set: { type: boolean } }, required: [a_set, b_set] }
effects: reads
secrets: [TOKEN_A]
runtime: { process: { command: [python3, programs/step.py, show-secrets] } }
