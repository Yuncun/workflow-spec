name: acme/send-chat-message
version: 1.0.0
title: Send a chat message
description: Post a message to a team chat channel and return the message's id.
inputSchema:
  type: object
  properties:
    channel: { type: string, pattern: "^#[a-z0-9-]+$", description: "Channel name, such as #general." }
    text: { type: string, minLength: 1, maxLength: 4000 }
  required: [channel, text]
outputSchema:
  type: object
  properties:
    id: { type: string }
  required: [id]
effects: writes
idempotent: false
destructive: false
secrets: [CHAT_TOKEN]
runtime: { container: { image: ghcr.io/acme/send-chat-message:1.0.0 } }
