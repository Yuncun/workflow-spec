name: acme/list-dependencies
version: 1.0.0
title: List dependencies
description: List the packages a repository depends on, from its lock files, at a branch, tag or commit.
inputSchema:
  type: object
  properties:
    repo: { type: string, description: Repository as owner/name., pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$" }
    ref: { type: string, minLength: 1, default: main }
  required: [repo]
outputSchema:
  type: object
  properties:
    packages:
      type: array
      items:
        type: object
        properties:
          name: { type: string }
          version: { type: string }
          ecosystem: { type: string, enum: [npm, pypi, nuget, maven] }
        required: [name, version, ecosystem]
  required: [packages]
effects: reads
deterministic: false
secrets: [GITHUB_TOKEN]
runtime: { container: { image: ghcr.io/acme/list-dependencies:1.0.0 } }
