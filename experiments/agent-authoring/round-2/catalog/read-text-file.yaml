name: acme/read-text-file
version: 1.0.0
title: Read a text file
description: Return the contents of a text file as a string.
inputSchema:
  type: object
  properties:
    file: { $ref: urn:wfspec:file, x-mediaType: "text/*" }
  required: [file]
outputSchema:
  type: object
  properties:
    text: { type: string }
  required: [text]
effects: none
deterministic: true
runtime: { container: { image: ghcr.io/acme/read-text-file:1.0.0 } }
