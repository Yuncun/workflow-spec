name: acme/render-table
version: 1.0.0
title: Render a Markdown table
description: Turn a list of objects into a Markdown table with the given columns, in the given order.
inputSchema:
  type: object
  properties:
    rows: { type: array, items: { type: object } }
    columns: { type: array, items: { type: string }, minItems: 1 }
  required: [rows, columns]
outputSchema:
  type: object
  properties:
    markdown: { type: string }
  required: [markdown]
effects: none
deterministic: true
runtime: { container: { image: ghcr.io/acme/render-table:1.0.0 } }
