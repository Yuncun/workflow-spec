name: acme/post-pr-comment
version: 1.1.0
title: Comment on a pull request
description: Post a comment on a pull request and return the comment's URL.
inputSchema:
  type: object
  properties:
    repo: { type: string, description: Repository as owner/name., pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$" }
    pr: { type: integer, minimum: 1 }
    body: { type: string, minLength: 1, maxLength: 65536 }
  required: [repo, pr, body]
outputSchema:
  type: object
  properties:
    url: { type: string, format: uri }
  required: [url]
effects: writes
idempotent: false
destructive: false
secrets: [GITHUB_TOKEN]
runtime: { container: { image: ghcr.io/acme/post-pr-comment:1.1.0 } }
