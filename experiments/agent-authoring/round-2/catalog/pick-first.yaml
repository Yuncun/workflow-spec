name: acme/pick-first
version: 1.0.0
title: Pick the first item
description: Return the first item of a list of objects. Fails if the list is empty.
inputSchema:
  type: object
  properties:
    items: { type: array, items: { type: object } }
  required: [items]
outputSchema:
  type: object
  properties:
    first: { type: object }
  required: [first]
effects: none
deterministic: true
runtime: { container: { image: ghcr.io/acme/pick-first:1.0.0 } }
