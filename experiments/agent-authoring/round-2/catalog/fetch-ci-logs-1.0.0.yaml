name: acme/fetch-ci-logs
version: 1.0.0
title: Fetch CI logs (old)
description: Download the logs of one finished CI run as a text file.
inputSchema:
  type: object
  properties:
    repo: { type: string, description: Repository as owner/name., pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$" }
    run: { type: integer, minimum: 1 }
  required: [repo, run]
outputSchema:
  type: object
  properties:
    logs: { $ref: urn:wfspec:file, x-mediaType: text/plain }
  required: [logs]
effects: reads
deterministic: true
secrets: [GITHUB_TOKEN]
runtime: { container: { image: ghcr.io/acme/fetch-ci-logs:1.0.0 } }
