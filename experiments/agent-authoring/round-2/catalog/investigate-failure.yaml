# A broad agent step: it decides for itself which of its tools to call. It can open
# issues, so its effects are 'writes'. examples/runs/investigate.run.json records one
# run of it, and examples/workflows/ci-triage.yaml is that run saved as a workflow.
name: acme/investigate-failure
version: 0.1.0
title: Investigate a CI failure
description: Look into a failed CI run using the allowed tools, and file an issue if the failure is real.
inputSchema:
  type: object
  properties:
    repo:
      type: string
      description: Repository as owner/name.
      pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    run_id:
      type: integer
      minimum: 1
  required: [repo, run_id]
outputSchema:
  type: object
  properties:
    summary:
      type: string
    issue:
      type: string
      format: uri
  required: [summary]
effects: writes
idempotent: false
destructive: false
secrets: [GITHUB_TOKEN]
runtime:
  agent:
    model: claude-opus-5-5
    instructions: prompts/investigate.md
    tools: [acme/fetch-ci-logs@2.1.0, acme/open-issue@1.0.3]
    maxTurns: 40
resources:
  timeout: 30m
