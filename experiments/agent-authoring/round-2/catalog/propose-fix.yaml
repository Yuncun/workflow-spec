name: acme/propose-fix
version: 0.3.0
title: Propose a fix
description: Read a failing test and the test logs, and propose file changes that fix the failure, with a pull request title and an explanation.
inputSchema:
  type: object
  properties:
    repo: { type: string, description: Repository as owner/name., pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$" }
    failure: { type: object, properties: { test: { type: string }, message: { type: string } }, required: [test, message] }
    logs: { $ref: urn:wfspec:file, x-mediaType: text/plain }
  required: [repo, failure, logs]
outputSchema:
  type: object
  properties:
    changes: { type: array, minItems: 1, items: { type: object, properties: { path: { type: string }, content: { type: string } }, required: [path, content] } }
    title: { type: string, minLength: 1, maxLength: 120 }
    explanation: { type: string, minLength: 1 }
  required: [changes, title, explanation]
effects: reads
deterministic: false
secrets: [GITHUB_TOKEN]
runtime:
  agent: { model: claude-opus-5-5, instructions: prompts/propose-fix.md, maxTurns: 30 }
