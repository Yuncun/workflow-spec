name: eric/label-ci-issue
version: 1.0.0
description: Triage a failed CI run's logs, open an issue with the triage report, and label the issue by failure category.
inputSchema:
  type: object
  properties:
    repo:
      type: string
      description: Repository as owner/name.
      pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    run_id:
      type: integer
      minimum: 1
  required: [repo, run_id]
outputs:
  issue: { from: steps.issue.outputs.url }
  label: { from: steps.label.outputs.labeled }
steps:
  logs:
    uses: acme/fetch-ci-logs@2.1.0
    with:
      repo: { from: inputs.repo }
      run_id: { from: inputs.run_id }
  triage:
    uses: acme/triage-logs@0.4.1
    with:
      logs: { from: steps.logs.outputs.logs }
  label_for_category:
    uses: acme/map-value@1.0.0
    with:
      value: { from: steps.triage.outputs.category }
      mapping: { test: test, flaky: flaky, infrastructure: infra, build: bug }
  issue:
    uses: acme/open-issue@1.0.3
    with:
      repo: { from: inputs.repo }
      title: { from: steps.triage.outputs.title }
      body: { from: steps.triage.outputs.report }
  label:
    uses: acme/label-issue@1.0.0
    with:
      url: { from: steps.issue.outputs.url }
      label: { from: steps.label_for_category.outputs.result }
