name: your-team/fix-first-failure
version: 1.0.0
description: Run a branch's unit tests, have an agent propose a fix for the first failing test, and open a pull request on fix/first-failure.
inputSchema:
  type: object
  properties:
    repo: { type: string, pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$" }
    branch: { type: string, minLength: 1 }
  required: [repo, branch]
outputs:
  pr_url: { from: steps.pr.outputs.url }
steps:
  tests:
    uses: acme/run-tests@3.1.0
    with: { repo: { from: inputs.repo }, ref: { from: inputs.branch }, suite: unit }
  first:
    uses: acme/pick-first@1.0.0
    with: { items: { from: steps.tests.outputs.failures } }
  fix:
    uses: acme/propose-fix@0.3.0
    with:
      repo: { from: inputs.repo }
      failure: { from: steps.first.outputs.first }
      logs: { from: steps.tests.outputs.logs }
  pr:
    uses: acme/open-pull-request@1.3.0
    with:
      repo: { from: inputs.repo }
      branch: fix/first-failure
      base: { from: inputs.branch }
      title: { from: steps.fix.outputs.title }
      body: { from: steps.fix.outputs.explanation }
      changes: { from: steps.fix.outputs.changes }
