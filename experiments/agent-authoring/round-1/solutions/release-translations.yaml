inputSchema:
  type: object
  properties:
    repo: { type: string, pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$" }
    tag: { type: string, minLength: 1 }
  required: [repo, tag]
steps:
  notes: { uses: acme/fetch-release-notes@1.0.0, with: { repo: { from: inputs.repo }, tag: { from: inputs.tag } } }
  ja: { uses: acme/translate-text@1.0.0, with: { text: { from: steps.notes.outputs.notes }, target_language: ja } }
  de: { uses: acme/translate-text@1.0.0, with: { text: { from: steps.notes.outputs.notes }, target_language: de } }
  post_ja: { uses: acme/send-chat-message@1.0.0, with: { channel: "#releases", text: { from: steps.ja.outputs.translation } } }
  post_de: { uses: acme/send-chat-message@1.0.0, with: { channel: "#releases", text: { from: steps.de.outputs.translation } } }
