name: acme/check-outdated
version: 2.0.0
title: Find outdated packages
description: Look up each package in its registry and return the ones with a newer version available.
inputSchema:
  type: object
  properties:
    packages:
      type: array
      items:
        type: object
        properties:
          name: { type: string }
          version: { type: string }
          ecosystem: { type: string, enum: [npm, pypi, nuget, maven] }
        required: [name, version, ecosystem]
  required: [packages]
outputSchema:
  type: object
  properties:
    outdated:
      type: array
      items:
        type: object
        properties:
          name: { type: string }
          current: { type: string }
          latest: { type: string }
          ecosystem: { type: string, enum: [npm, pypi, nuget, maven] }
        required: [name, current, latest, ecosystem]
    count: { type: integer, minimum: 0 }
  required: [outdated, count]
effects: reads
deterministic: false
runtime: { container: { image: ghcr.io/acme/check-outdated:2.0.0 } }
