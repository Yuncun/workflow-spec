name: acme/translate-text
version: 1.0.0
title: Translate text
description: Translate text into another language, keeping Markdown formatting.
inputSchema:
  type: object
  properties:
    text: { type: string, minLength: 1 }
    target_language: { type: string, enum: [ja, de, fr, es, pt-BR] }
  required: [text, target_language]
outputSchema:
  type: object
  properties:
    translation: { type: string }
  required: [translation]
effects: reads
deterministic: false
runtime:
  agent: { model: claude-sonnet-5-5, instructions: prompts/translate.md, maxTurns: 5 }
