name: acme/pr-summary-for-everyone
version: 1.0.0
description: Summarize a pull request for a non-technical audience in at most 150 words and post it as a comment.
inputSchema:
  type: object
  properties:
    repo: { type: string, pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$" }
    pr: { type: integer, minimum: 1 }
  required: [repo, pr]
outputs:
  comment: { from: steps.post.outputs.url }
steps:
  diff:
    uses: acme/fetch-pr-diff@1.2.0
    with: { repo: { from: inputs.repo }, pr: { from: inputs.pr } }
  summary:
    uses: acme/summarize-diff@1.0.0
    with:
      diff: { from: steps.diff.outputs.diff }
      audience: everyone
      max_words: 150
  post:
    uses: acme/post-pr-comment@1.1.0
    with:
      repo: { from: inputs.repo }
      pr: { from: inputs.pr }
      body: { from: steps.summary.outputs.summary }
