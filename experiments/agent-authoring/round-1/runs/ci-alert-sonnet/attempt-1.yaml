name: ci-alert/ci-failure-alert
version: 1.0.0
description: Triage a failed CI run's logs, open a ci-failure issue with the report, and announce the issue in #ci-alerts.
inputSchema:
  type: object
  properties:
    repo: { type: string, pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$" }
    run_id: { type: integer, minimum: 1 }
  required: [repo, run_id]
outputs:
  issue: { from: steps.issue.outputs.url }
  message_id: { from: steps.announce.outputs.id }
steps:
  logs:
    uses: acme/fetch-ci-logs@2.1.0
    with: { repo: { from: inputs.repo }, run_id: { from: inputs.run_id } }
  triage:
    uses: acme/triage-logs@0.4.1
    with: { logs: { from: steps.logs.outputs.logs } }
  issue:
    uses: acme/open-issue@1.0.3
    with:
      repo: { from: inputs.repo }
      title: { from: steps.triage.outputs.title }
      body: { from: steps.triage.outputs.report }
      labels: [ci-failure]
  message:
    uses: acme/format-text@1.0.0
    with:
      template: "New CI issue: {a}"
      a: { from: steps.issue.outputs.url }
  announce:
    uses: acme/send-chat-message@1.0.0
    with:
      channel: "#ci-alerts"
      text: { from: steps.message.outputs.text }
