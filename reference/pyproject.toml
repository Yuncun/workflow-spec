[project]
name = "wfspec"
version = "0.3.0"
description = "Reference checker for the workflow spec in this repository"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23", "ruamel.yaml>=0.18", "rfc8785>=0.1.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wfspec = "wfspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
